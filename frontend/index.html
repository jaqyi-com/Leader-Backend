<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- ═══════════════════════════════════════════════════════
         CORE SEO — Title & Description
         Target keywords: B2B contact database, lead generation,
         B2B intelligence, verified emails, sales prospecting India
    ═══════════════════════════════════════════════════════ -->
    <title>Doott — B2B Contact Database &amp; Lead Generation Platform | 43.9M People</title>
    <meta
      name="description"
      content="Doott gives sales teams, founders, and recruiters instant access to a live B2B contact database of 43.9 million people with verified emails, phone numbers, job titles, and company data. Search, filter, and export leads in seconds. No per-seat pricing."
    />
    <meta name="keywords" content="B2B contact database, lead generation platform, sales prospecting, verified email list, B2B intelligence, find business contacts, outbound sales tools, B2B database India, people database, company database, ZoomInfo alternative, Apollo alternative, export leads CSV" />
    <meta name="author" content="Doott" />
    <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1" />

    <!-- ═══════════════════════════════════════════════════════
         CANONICAL & LANGUAGE
    ═══════════════════════════════════════════════════════ -->
    <link rel="canonical" href="https://doott.jaqyi.com/" />
    <meta http-equiv="content-language" content="en" />

    <!-- ═══════════════════════════════════════════════════════
         OPEN GRAPH — Social sharing (Facebook, LinkedIn, WhatsApp)
    ═══════════════════════════════════════════════════════ -->
    <meta property="og:type"        content="website" />
    <meta property="og:site_name"   content="Doott" />
    <meta property="og:url"         content="https://doott.jaqyi.com/" />
    <meta property="og:title"       content="Doott — B2B Contact Database &amp; Lead Generation Platform" />
    <meta property="og:description" content="Access 43.9 million verified B2B contacts. Search by job title, location, company. Export to CSV instantly. Built for sales teams, founders, and recruiters." />
    <meta property="og:image"       content="https://doott.jaqyi.com/doott-logo.png" />
    <meta property="og:image:width"  content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:image:alt"    content="Doott B2B Lead Generation Platform" />
    <meta property="og:locale"      content="en_US" />

    <!-- ═══════════════════════════════════════════════════════
         TWITTER CARD — X / Twitter sharing
    ═══════════════════════════════════════════════════════ -->
    <meta name="twitter:card"        content="summary_large_image" />
    <meta name="twitter:site"        content="@doott" />
    <meta name="twitter:title"       content="Doott — B2B Contact Database &amp; Lead Generation Platform" />
    <meta name="twitter:description" content="43.9M people. Verified emails &amp; phones. Search, filter, export. No per-seat limits." />
    <meta name="twitter:image"       content="https://doott.jaqyi.com/doott-logo.png" />
    <meta name="twitter:image:alt"   content="Doott B2B Lead Generation Platform" />

    <!-- ═══════════════════════════════════════════════════════
         ICONS & THEME
    ═══════════════════════════════════════════════════════ -->
    <link rel="icon"             type="image/png"    href="/doott-logo.png" />
    <link rel="apple-touch-icon"                     href="/doott-logo.png" />
    <meta name="theme-color" content="#cc0000" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ═══════════════════════════════════════════════════════
         PERFORMANCE — Font preconnects
    ═══════════════════════════════════════════════════════ -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- ═══════════════════════════════════════════════════════
         STRUCTURED DATA — JSON-LD
         1. SoftwareApplication  (rich results for the product)
         2. Organization         (brand entity & sitelinks)
         3. FAQPage              (FAQ rich snippets + AI citations)
    ═══════════════════════════════════════════════════════ -->

    <!-- 1. SoftwareApplication -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "Doott",
      "url": "https://doott.jaqyi.com/",
      "applicationCategory": "BusinessApplication",
      "operatingSystem": "Web Browser",
      "description": "Doott is a B2B contact database and lead generation platform giving sales teams, founders, and recruiters access to 43.9 million verified people records with emails, phone numbers, job titles, and company data.",
      "featureList": [
        "43.9 million B2B contact records",
        "Verified email addresses",
        "Verified phone numbers",
        "Company intelligence database",
        "Full-text search and advanced filters",
        "One-click CSV export",
        "AI-powered RAG chatbot",
        "Social media automation",
        "Multi-tenant organization support",
        "CRM pipeline management"
      ],
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD",
        "description": "Free to start. No credit card required."
      },
      "publisher": {
        "@type": "Organization",
        "name": "Doott",
        "url": "https://doott.jaqyi.com/"
      }
    }
    </script>

    <!-- 2. Organization -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Doott",
      "url": "https://doott.jaqyi.com/",
      "logo": "https://doott.jaqyi.com/doott-logo.png",
      "description": "Doott is a B2B intelligence and lead generation platform with a live database of 43.9 million people — searchable, filterable, and exportable.",
      "sameAs": [],
      "contactPoint": {
        "@type": "ContactPoint",
        "contactType": "customer support",
        "availableLanguage": ["English"]
      }
    }
    </script>

    <!-- 3. FAQPage -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "How many contacts are in the Doott B2B database?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Doott's live database contains 43,932,594 individual people records, each with full name, job title, company, location (city, state, pincode), LinkedIn URL, emails, and phone numbers."
          }
        },
        {
          "@type": "Question",
          "name": "How fresh is the B2B data on Doott?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "The People and Companies databases are stored in Google Cloud SQL PostgreSQL and updated via automated enrichment pipelines. The live record count of 43,932,594 reflects the current state of the database as of the last pipeline run."
          }
        },
        {
          "@type": "Question",
          "name": "Can I filter contacts by verified email or phone number?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. Doott has dedicated Email and Number sub-views that filter the full People database to only contacts who have non-empty verified email addresses or phone numbers — making outreach targeting much cleaner."
          }
        },
        {
          "@type": "Question",
          "name": "Can I export B2B leads to CSV?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes — every view (People, Email, Number, Companies) has a one-click Export CSV button. It exports the current filtered and paginated result set directly to your browser. There are no row limits on the export."
          }
        },
        {
          "@type": "Question",
          "name": "Is Doott free to use?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes, Doott is free to start with no credit card required. You get immediate access to the People, Email, Number, and Companies databases."
          }
        },
        {
          "@type": "Question",
          "name": "Is Doott a ZoomInfo or Apollo alternative?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. Doott is a B2B contact database and sales intelligence platform similar to ZoomInfo and Apollo.io, with 43.9 million verified contacts, CSV export, and no per-seat pricing."
          }
        }
      ]
    }
    </script>

    <!-- 4. WebSite with SearchAction (Sitelinks Search Box signal) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Doott",
      "url": "https://doott.jaqyi.com/",
      "description": "B2B contact database and lead generation platform with 43.9 million people records.",
      "potentialAction": {
        "@type": "SearchAction",
        "target": {
          "@type": "EntryPoint",
          "urlTemplate": "https://doott.jaqyi.com/app/people?q={search_term_string}"
        },
        "query-input": "required name=search_term_string"
      }
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
